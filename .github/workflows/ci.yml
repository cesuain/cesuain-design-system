name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Uses the version pinned in package.json "packageManager".

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tokens (validation, contrast and generated files)
        run: pnpm tokens:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Docs match code
        run: pnpm docs:check

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Story tests (interactions + axe)
        run: pnpm test:stories

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Upload Storybook
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/docs/storybook-static
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
